
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>K7KASHI CYBER LAB</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #050908;
    color: #00ff88;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 450px;
    padding: 35px 25px;
    background: #0b1511;
    border: 1px solid #00ff8855;
    border-radius: 18px;
    box-shadow: 0 0 35px #00ff8820;
    text-align: center;
}

.logo {
    font-size: 36px;
    font-weight: bold;
    text-shadow: 0 0 18px #00ff88;
    letter-spacing: 2px;
}

.subtitle {
    color: #9bb9a8;
    font-size: 12px;
    margin-top: 10px;
    letter-spacing: 2px;
}

.line {
    height: 1px;
    background: #176b45;
    margin: 28px 0;
}

h2 {
    font-size: 23px;
    margin-bottom: 12px;
}

.description {
    color: #9bb9a8;
    font-size: 14px;
    line-height: 1.8;
    margin-bottom: 28px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 13px;
    border: 1px solid #00ff88;
    border-radius: 9px;
    background: #00ff88;
    color: #001a0c;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #00cc70;
    box-shadow: 0 0 18px #00ff8866;
    transform: translateY(-2px);
}

button.login {
    background: transparent;
    color: #00ff88;
}

button.login:hover {
    background: #00ff8815;
}

.notice {
    margin-top: 30px;
    color: #82988b;
    font-size: 11px;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">K7KASHI</div>

    <div class="subtitle">
        CYBER SECURITY LAB
    </div>

    <div class="line"></div>

    <h2>مرحباً بك في المختبر</h2>

    <div class="description">
        تعلّم الأمن السيبراني واكتشف عالم الاختبار الأخلاقي
        في بيئة تعليمية خاصة.
    </div>

    <button onclick="showMessage('صفحة إنشاء الحساب')">
        إنشاء حساب جديد
    </button>

    <button class="login" onclick="showMessage('صفحة تسجيل الدخول')">
        تسجيل الدخول
    </button>

    <div class="notice">
        K7KASHI CYBER LAB © 2026
        <br>
        جميع الحقوق محفوظة
    </div>

</div>

<script>
function showMessage(page) {
    alert("سيتم إنشاء " + page + " في المرحلة القادمة!");
}
</script>

</body>
</html>
